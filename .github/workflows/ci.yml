name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo lint

      - name: Build workspace
        run: cargo build --workspace --release

  msrv:
    name: MSRV (1.87)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned MSRV toolchain
        uses: dtolnay/rust-toolchain@1.87.0

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Check workspace builds on the declared MSRV
        run: cargo check --workspace --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace

  # Deploy-gated wire-test gate (#49, exercises the #22 wire tests). Self-
  # contained: it boots the relay, gates on the compose healthcheck, and runs
  # the --ignored docker-gated wire tests DIRECTLY so it is a real gate
  # regardless of whether #22's e2e-test.sh change has merged. CI fails if the
  # relay is down or any wire test fails.
  e2e:
    name: E2E Tests (deploy-gated wire tests)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned MSRV toolchain
        uses: dtolnay/rust-toolchain@1.87.0

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      # No continue-on-error: a failed relay bring-up MUST fail the job. --build
      # because CI has no prebuilt relay image (local dev uses one).
      - name: Start relay (docker compose)
        run: docker compose -f docker/docker-compose.yml up -d --build

      # Deploy gate: poll the compose healthcheck (nc -z localhost 8080) until the
      # relay reports (healthy). Up to 30 x 5s = 150s. If it never becomes
      # healthy, dump the relay logs for debugging and fail the job.
      - name: Wait for relay healthcheck
        run: |
          for i in $(seq 1 30); do
            if docker compose -f docker/docker-compose.yml ps relay | grep -q '(healthy)'; then
              echo "relay healthy after attempt $i"
              exit 0
            fi
            echo "attempt $i: relay not healthy yet; waiting 5s"
            sleep 5
          done
          echo "relay never became healthy; dumping logs:"
          docker compose -f docker/docker-compose.yml logs relay
          exit 1

      - name: Build workspace
        run: cargo build --workspace

      # --ignored runs ONLY the #[ignore]d docker-gated wire tests (the relay-
      # dependent ones); the in-process tests are covered by the `test` job this
      # job needs. --test-threads=1 avoids relay port contention. A wire-test
      # failure fails the job (no continue-on-error, no `|| true`).
      - name: Run wire tests (--ignored)
        run: cargo test -p e2e-tests -- --ignored --test-threads=1

      # Teardown may keep continue-on-error: a teardown failure should not fail an
      # otherwise-green run.
      - name: Stop relay (docker compose)
        if: always()
        run: docker compose -f docker/docker-compose.yml down
        continue-on-error: true

  # Timing-sensitive filesystem-watcher integration tests have flaked in the
  # past (debouncer does not deliver a 1:1 action->event mapping). Run them
  # repeatedly so a re-introduced race fails CI instead of reaching main.
  flaky-guard:
    name: Flaky Guard (watcher integration x5)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Build integration tests once
        run: cargo test -p e2e-tests --test file_watcher --test vault_sync --no-run

      - name: Run watcher integration tests 5x
        run: |
          for i in $(seq 1 5); do
            echo "=== iteration $i ==="
            cargo test -p e2e-tests --test file_watcher --test vault_sync || exit 1
          done

  # Supply-chain audit: licenses, banned crates, sources, and advisories.
  # Runs as a real gate on every push and pull request (no continue-on-error).
  # Known-unfixable transitive advisories are waived explicitly in deny.toml.
  audit:
    name: Supply-chain Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-deny (pinned)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      - name: Run cargo-deny (all sections)
        run: cargo deny check

  # Institutionalizes the #24/#26 decision (decision B): the WASM bundle is
  # built on demand from source, not committed. This job proves a pristine
  # checkout can build the WASM and the Obsidian plugin end to end. It is
  # deliberately independent (no `needs:`) so the clean-checkout path is a
  # standalone gate, and carries no `continue-on-error` — it must be a real gate.
  plugin:
    name: Plugin (WASM build + ESM tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned MSRV toolchain
        uses: dtolnay/rust-toolchain@1.87.0

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack (pinned)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: plugins/obsidian-ee/package-lock.json

      - name: Build WASM from source
        run: ./scripts/build-wasm.sh

      - name: Install plugin deps
        working-directory: plugins/obsidian-ee
        run: npm ci

      - name: Run plugin test suite
        working-directory: plugins/obsidian-ee
        run: npm test

      - name: Type-check plugin
        working-directory: plugins/obsidian-ee
        run: npx tsc --noEmit

      - name: Build plugin bundle
        working-directory: plugins/obsidian-ee
        run: npm run build

  # Secret scan: fail the build if a credential is committed. Independent gate
  # (no `needs:`) like `audit` and `plugin`, and no `continue-on-error` — it is
  # a real gate. Config in .gitleaks.toml allowlists test-only key material.
  # gitleaks-action v2 is free for public repos; if this repo is made private,
  # an org GITLEAKS_LICENSE secret is required (pass it via env).
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so gitleaks scans past commits

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # Auto-provided Actions token (NOT an API key) — gitleaks-action v2
          # requires it to scan pull_request events.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
