[package]
name = "collab-core"
description = "Core collaboration engine with Yrs CRDT and MLS encryption"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Opt-in on wasm32 only: routes openmls's clock through fluvio_wasm_timer.
# Kept off the native graph so the relay/CLI keep the OS clock (see collab-wasm).
wasm-clock = ["openmls/js"]

[dependencies]
collab-proto = { path = "../collab-proto" }
ed25519-dalek.workspace = true
yrs.workspace = true
openmls.workspace = true
openmls_rust_crypto.workspace = true
openmls_basic_credential.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true

[lints]
workspace = true
