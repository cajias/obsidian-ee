[package]
name = "collab-wasm"
description = "WebAssembly bindings for collaborative editing"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen.workspace = true
yrs.workspace = true
# The minted capability crosses to JS as JSON produced by the SAME serde impl the
# relay deserializes with, so the wire shape cannot drift (issue #72).
serde_json.workspace = true
# MLS engine reused across the wasm-bindgen boundary (issue #28).
collab-core = { path = "../collab-core" }

# wasm32 needs openmls's `js` clock; gating it here keeps `openmls/js` out of the
# native dependency graph, so feature unification can never turn it on for native.
[target.'cfg(target_arch = "wasm32")'.dependencies]
collab-core = { path = "../collab-core", features = ["wasm-clock"] }

[dev-dependencies]
# Native tests verify a minted capability against the protocol's own verifier.
collab-proto = { path = "../collab-proto" }
