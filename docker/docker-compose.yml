# Local development environment.
#
# The relay is the only service: it is a zero-knowledge, in-memory router and
# currently has no external dependencies. (The offline queue is in-memory; a
# DynamoDB-backed implementation is planned behind a Cargo feature, at which
# point a pinned localstack service can be reintroduced.)
#
# No top-level `version:` key: this uses the current Compose Specification.

services:
  relay:
    build:
      context: ..
      dockerfile: docker/Dockerfile.relay
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      # To require client authentication, set a token here or in a .env file:
      # - RELAY_AUTH_TOKEN=change-me
      #
      # RELAY_SUBSCRIBE_AUTHZ is deliberately UNSET (#94): the docker wire tier
      # runs against the binary's own ON-by-default (#72), which is the point of
      # the tier. Pinning it — to either value — is what made the gate stop
      # covering the behaviour #72 changed.
      #
      # The wire tests here therefore register a document anchor and mint a
      # SubscribeCapability, exactly as collab-cli and the plugin do:
      #   tests/e2e-tests/tests/full_flow.rs
      #     test_two_users_collaborate, test_offline_message_delivery
      # Each also carries a handshake-only observer that must receive NO
      # YrsUpdate, so re-pinning the variable off turns those tests RED rather
      # than silently deleting the coverage again.
      #
      # The one test that needs the gate OFF — fail_closed.rs, where Eve must
      # RECEIVE the ciphertext off the wire and still fail to decrypt, proving
      # MLS fails closed independently of the relay gate — no longer runs here.
      # It self-hosts its own relay with `.with_subscribe_authz(false)` stated
      # explicitly, so one compose relay no longer has to serve both gate states.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    # NOTE: `deploy.resources.limits` is a Docker Swarm field and is NOT
    # enforced by `docker compose` by default. To apply these limits locally,
    # run with `docker compose --compatibility up`.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
